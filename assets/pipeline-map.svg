    .blink { animation: blink 1.4s ease-in-out infinite; }
  </style>
  <rect x="10" y="20" width="150" height="70" rx="10" fill="#1d3557" stroke="#457b9d"/>
  <text x="85" y="48" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">Melbourne API</text>
  <text x="85" y="66" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a8dadc">per-minute feed</text>
  <path class="arrow" d="M 160 55 L 240 55" stroke="#e9c46a" stroke-width="3" fill="none"/>
  <rect x="240" y="20" width="150" height="70" rx="10" fill="#1d3557" stroke="#457b9d"/>
  <text x="315" y="48" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fff">Upstash Cache</text>
  <text x="315" y="66" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a8dadc">60s TTL snapshot</text>
  <path class="arrow" d="M 390 55 L 470 55" stroke="#e9c46a" stroke-width="3" fill="none"/>
